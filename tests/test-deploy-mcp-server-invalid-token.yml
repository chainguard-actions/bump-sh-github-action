name: Test deploy with mcp_server and invalid token fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          file: tests/fixtures/openapi.yml
          mcp_server: actionchain-nonexistent-mcp-test
          token: invalid-bump-token-for-testing
          command: deploy
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected mcp_server deploy to fail with an invalid token"
            exit 1
          fi
          echo "PASS"
