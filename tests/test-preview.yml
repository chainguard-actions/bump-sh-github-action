name: Test preview command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture API contract to workspace
        run: cp "$GITHUB_WORKSPACE/tests/fixtures/api-contract.yml" "$GITHUB_WORKSPACE/api-contract.yml"

      - id: action
        name: Run preview command
        uses: .
        with:
          command: preview
          file: api-contract.yml

      - name: Assert action succeeded (preview generates a public URL)
        run: |
          echo "Preview step completed successfully"
          echo "PASS"
