name: Test preview command
on:
  workflow_dispatch:
jobs:
  test-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run bump.sh preview command
        id: action
        uses: .
        with:
          command: preview
          file: tests/fixtures/api-contract.yml

      - name: Assert action completed without failure
        run: |
          echo "Preview command completed successfully"
          echo "PASS"
