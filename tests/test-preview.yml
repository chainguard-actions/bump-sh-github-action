name: Test preview command
on:
  workflow_dispatch:
jobs:
  test-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture API file to workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/api-contract.yml" "$GITHUB_WORKSPACE/api-contract.yml"

      - id: action
        uses: .
        with:
          command: preview
          file: api-contract.yml
          token: fake-bump-token-for-testing
        continue-on-error: true

      - name: Assert action ran (preview command attempted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed (unlikely without real token) or fail
          # with an API error — not a crash/missing-file error.
          # We accept both 'success' and 'failure' as valid outcomes here,
          # but NOT a missing step (which would indicate a setup problem).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced an outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
