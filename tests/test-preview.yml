name: Test preview command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          file: actions/hardened/bump-sh--github-action/v1.2.2/tests/fixtures/api-contract.yml
          command: preview
        continue-on-error: true
      - name: Assert action ran (preview may fail without network but should not crash on input parsing)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step completed"
