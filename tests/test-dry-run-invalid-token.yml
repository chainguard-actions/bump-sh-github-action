name: Test dry-run command with invalid token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture API contract to workspace
        run: cp "$GITHUB_WORKSPACE/tests/fixtures/api-contract.yml" "$GITHUB_WORKSPACE/api-contract.yml"

      - id: action
        name: Run dry-run command with invalid token
        uses: .
        with:
          command: dry-run
          file: api-contract.yml
          doc: test-doc
          token: invalid-token-for-testing
        continue-on-error: true

      - name: Assert action failed with auth/API error (not a file error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the token is invalid (API auth error)
          # It should NOT fail due to missing file or missing input
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid token"
