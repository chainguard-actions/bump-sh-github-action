name: Test dry-run command with invalid token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run bump.sh dry-run with invalid credentials
        id: action
        uses: .
        with:
          command: dry-run
          file: tests/fixtures/openapi.yml
          doc: test-doc-slug
          token: invalid-token-for-testing
        continue-on-error: true

      - name: Assert action failed with auth/API error (not a crash)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # dry-run with an invalid token should fail with an HTTP 401/403 or
          # similar API error — NOT succeed, and NOT crash with an unhandled exception.
          # The action should call core.setFailed() with a meaningful message.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when given an invalid token"
          else
            echo "FAIL: expected action to fail with invalid token but got: $OUTCOME"
            exit 1
          fi
