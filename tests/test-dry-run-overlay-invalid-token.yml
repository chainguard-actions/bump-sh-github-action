name: Test dry-run with overlay and invalid token fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Assert fixtures exist
        run: |
          test -f tests/fixtures/openapi.yml || { echo "FAIL: openapi fixture missing"; exit 1; }
          test -f tests/fixtures/overlay.yml || { echo "FAIL: overlay fixture missing"; exit 1; }
          echo "PASS"
      - id: action
        uses: .
        continue-on-error: true
        with:
          file: tests/fixtures/openapi.yml
          doc: actionchain-nonexistent-doc-test
          token: invalid-bump-token-for-testing
          command: dry-run
          overlay: tests/fixtures/overlay.yml
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected dry-run to fail with an invalid token"
            exit 1
          fi
          echo "PASS"
