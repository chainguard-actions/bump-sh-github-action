name: Test deploy basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal API definition file
        run: |
          cat > /tmp/api-contract.yml <<'EOF'
          openapi: "3.0.0"
          info:
            title: Test API
            version: "1.0.0"
          paths: {}
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          file: /tmp/api-contract.yml
          doc: test-doc-slug
          token: fake-token-for-testing
          command: deploy
      - name: Assert action ran (may fail due to invalid token)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail with an invalid token,
          # but it should have been invoked with the correct inputs.
          # We verify the step ran (not skipped).
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action step was invoked"
