name: Test hub and branch inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal API definition file
        run: |
          cat > /tmp/api-contract.yml << 'EOF'
          openapi: "3.0.0"
          info:
            title: Test API
            version: "1.0.0"
          paths: {}
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          file: /tmp/api-contract.yml
          doc: test-doc
          hub: test-hub-slug
          branch: feature-branch
          token: invalid-token-for-testing
          command: dry-run
      - name: Assert action ran (with hub and branch inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail with an API error (not a missing-input error)
          # We just need to confirm the action ran with hub and branch inputs provided
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with hub and branch inputs"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
