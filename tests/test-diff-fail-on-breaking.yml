name: Test diff command with fail_on_breaking
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal OpenAPI definition file
        run: |
          cat > /tmp/diff-api.yml << 'EOF'
          openapi: "3.0.0"
          info:
            title: Diff Test API
            version: "1.0.0"
          paths:
            /items:
              get:
                summary: List items
                responses:
                  "200":
                    description: OK
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: diff
          file: /tmp/diff-api.yml
          doc: test-doc-slug
          token: fake-token-for-testing
          fail_on_breaking: "true"

      - name: Assert action ran with diff command and fail_on_breaking
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Without a valid token, the diff command should fail (not crash)
          # The action should produce a clear outcome either way
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced an outcome"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
