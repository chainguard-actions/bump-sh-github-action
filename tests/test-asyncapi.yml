name: Test AsyncAPI definition format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal AsyncAPI definition file
        run: |
          cat > /tmp/asyncapi.yml << 'EOF'
          asyncapi: "2.6.0"
          info:
            title: Test Event API
            version: "1.0.0"
          channels:
            user/signedup:
              subscribe:
                message:
                  payload:
                    type: object
                    properties:
                      userId:
                        type: string
          EOF

      - id: action
        uses: .
        with:
          file: /tmp/asyncapi.yml
          command: dry-run
          doc: test-async-doc
          token: fake-token-for-test
        continue-on-error: true

      - name: Assert action ran
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action will fail at the API call with a fake token,
          # but the step should not be skipped — it should be executed
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action step was executed (outcome: ${{ steps.action.outcome }})"
