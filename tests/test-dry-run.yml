name: Test dry-run command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dry-run
          file: pristine/bump-sh--github-action/v1.2.10/tests/fixtures/api-contract.yml
          doc: test-doc
          token: fake-token-for-testing

      - name: Assert action ran (expected to fail with API error, not setup error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action should either succeed or fail with an API/auth error.
          # It should NOT fail due to missing file or missing node modules.
          # We accept both 'success' and 'failure' as valid outcomes here,
          # since without real credentials the API call will be rejected.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran to completion (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
