name: Test dry-run command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal OpenAPI spec
        run: |
          cat > /tmp/api-contract.yml << 'EOF'
          openapi: "3.1.0"
          info:
            title: Test API
            version: "1.0.0"
          paths:
            /hello:
              get:
                summary: Say hello
                responses:
                  "200":
                    description: OK
          EOF

      - id: action
        uses: .
        with:
          file: /tmp/api-contract.yml
          command: dry-run
          doc: test-doc
          token: fake-token-for-dry-run
        continue-on-error: true

      - name: Assert action ran
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # dry-run with a fake token may fail due to API auth, but the action should at least start
          # We verify the step ran (not skipped) and the action binary executed
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action step executed (outcome: ${{ steps.action.outcome }})"
