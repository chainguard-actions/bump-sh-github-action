name: Test dry-run command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal OpenAPI definition file
        run: |
          cat > /tmp/test-api.yml << 'EOF'
          openapi: "3.0.0"
          info:
            title: Test API
            version: "1.0.0"
          paths:
            /hello:
              get:
                summary: Say hello
                responses:
                  "200":
                    description: OK
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dry-run
          file: /tmp/test-api.yml
          doc: test-doc-slug
          token: fake-token-for-testing

      - name: Assert action ran (may fail due to invalid token but should not crash)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail with an API error (not a crash)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced an outcome"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
