name: Test diff command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: diff
          file: pristine/bump-sh--github-action/v1.2.10/tests/fixtures/api-contract.yml
          doc: test-doc
          token: fake-token-for-testing
          fail_on_breaking: false

      - name: Assert action ran (expected to fail with auth error, not setup error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # Without real credentials, the diff will fail with an API/auth error.
          # We verify the action ran to completion (not a missing-file or node error).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran to completion (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
