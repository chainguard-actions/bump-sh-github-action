name: Test overlay input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal API definition and overlay files
        run: |
          cat > /tmp/api-contract.yml << 'EOF'
          openapi: "3.0.0"
          info:
            title: Test API
            version: "1.0.0"
          paths: {}
          EOF
          cat > /tmp/overlay.yml << 'EOF'
          overlay: "1.0.0"
          info:
            title: Test Overlay
            version: "1.0.0"
          actions: []
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          file: /tmp/api-contract.yml
          doc: test-doc
          token: invalid-token-for-test
          command: deploy
          overlay: /tmp/overlay.yml
      - name: Assert action ran with overlay input
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should either succeed or fail due to invalid token,
          # but it must have accepted the overlay input (not fail due to unknown input)
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with overlay input"
