name: Test deploy command with hub
on:
  workflow_dispatch:
jobs:
  test-deploy-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture API file to workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/api-contract.yml" "$GITHUB_WORKSPACE/api-contract.yml"

      - id: action
        uses: .
        with:
          command: deploy
          file: api-contract.yml
          hub: test-hub-slug
          token: fake-bump-token-for-testing
          filename_pattern: "{slug}-api"
        continue-on-error: true

      - name: Assert action ran (deploy with hub attempted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail with an API error (invalid token/hub).
          # We accept both outcomes — the important thing is the action ran.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced an outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
